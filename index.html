<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f1f5e9"><title>Домашняя кулинарная книга</title><link rel="stylesheet" href="style.css"><script src="https://telegram.org/js/telegram-web-app.js"></script></head><body>
<header><h1>Что сегодня<br>приготовим?</h1><button id="add" class="fab" aria-label="Добавить рецепт">＋</button></header>
<div class="searchbar"><input id="search" type="search" placeholder="Блюдо или ингредиент"></div>
<nav id="cats" aria-label="Категории"></nav>
<main><p id="count"></p><div id="recipes" class="grid"></div></main>
<dialog id="detail"><button class="close" data-close="detail" aria-label="Закрыть">×</button><div id="detailContent"></div></dialog>
<dialog id="addDialog"><button class="close" data-close="addDialog" aria-label="Закрыть">×</button><h2 id="formTitle">Новый рецепт</h2>
<form id="form"><label>Название<input name="title" required></label>
<div class="row"><label>Категория<select name="category"></select></label><label>Время, мин<input name="time" type="number" min="1" value="30" required></label></div>
<div class="row"><label>Эмодзи<input name="emoji" value="🍲" maxlength="4"></label><label>Ссылка на фото<input name="photo" type="url" placeholder="необязательно"></label></div>
<label>Коротко о блюде<input name="description"></label>
<label>Ингредиенты, каждый с новой строки<textarea name="ingredients" required placeholder="Творог — 400 г"></textarea></label>
<label>Шаги, каждый с новой строки<textarea name="steps" required></textarea></label>
<button class="primary">Сохранить рецепт</button><button type="button" id="export" class="ghost">Скопировать мои рецепты (JSON)</button></form></dialog>
<div id="toast" role="status"></div>
<script src="recipes.js"></script><script src="app.js"></script></body></html>
